name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!

        This repository targets the local Android Codex app and its reused CC Pocket UI package.
        Please explain how the requested change should be validated on Android.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Android Codex does this relate to?
      options:
        - Android Codex app
        - CC Pocket UI package
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: I find it difficult to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like this to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've thought about?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, screenshots, mockups, or target platform details.
    validations:
      required: false
