name: Bug Report
description: Report a bug in Android Codex
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        
        This repository targets the local Android Codex app and its reused CC Pocket UI package.
        Please include the Android version, device or emulator, logs, and clear reproduction steps.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Android Codex is affected?
      options:
        - Android Codex app
        - CC Pocket UI package
        - Runtime/toolchain
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Tell us what went wrong
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the bug?
      placeholder: |
        1. Open the app
        2. Go to ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Version and environment details.
      placeholder: |
        - App version: x.x.x
        - Bridge version: x.x.x
        - OS: macOS / iOS / Android
        - Node.js version (Bridge): x.x
        - If platform-specific: device / shell / terminal / reverse proxy details
      render: markdown
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: If applicable, add logs or screenshots.
    validations:
      required: false
