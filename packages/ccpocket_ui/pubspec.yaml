name: ccpocket_ui
description: Presentation-only source surface extracted from the CC Pocket app.
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^8.0.0
  expandable_page_view: ^1.2.1
  extended_image: ^10.0.1
  flutter_markdown: ^0.7.7+1
  flutter_svg: ^2.0.17
  crypto: ^3.0.6
  http: ^1.5.0
  highlight: ^0.7.0
  markdown: ^7.3.0
  syntax_highlight:
    path: ../syntax_highlight_stub
  url_launcher: ^6.3.1
  flutter_slidable: ^4.0.3
  shared_preferences: ^2.5.0
  skeletonizer: ^2.1.3
  share_plus:
    path: ../share_plus_stub

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
